<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>大肥鱼 · 干饭大作战</title>
<!--
  v3 · 2026-11-01
  + 新道具：时缓（5 秒掉落变慢）、清屏（一次清掉屏幕上所有辣椒锅铲并按个计分）
  + 鱼会随移动倾斜，接到东西时会张嘴
  + 结算新增命中率（接到 / 漏掉）
  v2 · 2026-11-01
  + 道具系统：护盾（挡一次伤害）、吸铁（8 秒好物自动吸附）、双倍（10 秒分数翻倍）
  + 最高连击统计进结算面板
  + HUD 底部显示当前道具与剩余时间
  v1 · 2026-10-31 初版：接白饭 / 红烧肉 / 小鲸鱼，躲辣椒与锅铲，连击倍率
-->
<style>
  html,body{height:100%;margin:0;overflow:hidden;touch-action:none;
    background:radial-gradient(120% 85% at 50% 0%, #1b4f80 0%, #0b1d33 58%, #050d17 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  #wrap{position:relative;width:min(94vw, calc(96vh * 0.6667));aspect-ratio:2/3;max-height:96vh}
  canvas{width:100%;height:100%;display:block;border-radius:20px;
    box-shadow:0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(120,200,255,.18) inset;
    cursor:none;background:#0b1d33}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
(function(){
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 480, H = 720;

  function fit(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();
  window.addEventListener("resize", fit);

  /* ---------- 声音（纯合成，不加载任何文件） ---------- */
  var ac = null;
  function initAudio(){
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ac = null; }
  }
  function beep(freq, dur, type, vol){
    if (!ac) return;
    try{
      var t = ac.currentTime;
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol == null ? 0.05 : vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }catch(e){}
  }

  /* ---------- 状态 ---------- */
  var S = {
    mode: "title",
    score: 0, best: 0, lives: 3,
    combo: 0, comboTimer: 0,
    level: 1, t: 0, spawnT: 0, shake: 0,
    items: [], parts: [], pops: [], bubbles: [],
    overAt: 0, lastQuip: "",
    maxCombo: 0, shield: false, magnet: 0, x2: 0,
    slow: 0, mouth: 0, hits: 0, misses: 0, tilt: 0
  };
  try { S.best = parseInt(localStorage.getItem("dfy_best") || "0", 10) || 0; } catch(e){}

  var player = { x: W/2, y: H - 92, r: 30, targetX: W/2 };
  var keyDir = 0, keyLeft = false, keyRight = false;

  var QUIPS = [
    "白饭不是白吃的，是白给的。",
    "辣椒也是饭，你信吗？我不信。",
    "这条尾巴，今天第三次拍地。",
    "干饭要紧，脸面第二。",
    "再来一把，我给你留半碗。"
  ];

  /* ---------- 工具 ---------- */
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
  function comboMult(){ return Math.min(5, 1 + Math.floor(S.combo / 5)); }

  /* ---------- 生成 ---------- */
  function spawnItem(){
    var lv = S.level;
    var r = Math.random();
    var badChance = Math.min(0.30, 0.10 + lv * 0.016);
    var kind;
    var POWER = ["shield", "magnet", "x2", "slow", "clear"];
    if (r < 0.05) kind = "fish";
    else if (r < 0.17) kind = POWER[Math.floor(Math.random() * POWER.length)];
    else if (r < 0.28) kind = "meat";
    else if (r < 0.28 + badChance) kind = (Math.random() < 0.5 ? "chili" : "pan");
    else kind = "rice";

    var isBad = (kind === "chili" || kind === "pan");
    var isPower = (POWER.indexOf(kind) >= 0);
    S.items.push({
      kind: kind,
      x: rnd(46, W - 46),
      y: -40,
      r: isBad ? 23 : (isPower ? 22 : 25),
      vy: rnd(120, 165) + lv * 17,
      rot: rnd(-0.4, 0.4),
      spin: rnd(-1.6, 1.6)
    });
  }

  function burst(x, y, color, n, power){
    for (var i = 0; i < n; i++){
      var a = Math.random() * Math.PI * 2, sp = rnd(40, power || 220);
      S.parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: rnd(0.35, 0.8), max: 0.8,
        size: rnd(2, 5), color: color
      });
    }
  }
  function pop(x, y, text, color){
    S.pops.push({ x: x, y: y, text: text, color: color, life: 0.85, max: 0.85 });
  }

  /* ---------- 开局 / 结束 ---------- */
  function start(){
    S.mode = "play"; S.score = 0; S.lives = 3; S.combo = 0; S.comboTimer = 0;
    S.level = 1; S.t = 0; S.spawnT = 0.4; S.shake = 0;
    S.maxCombo = 0; S.shield = false; S.magnet = 0; S.x2 = 0;
    S.slow = 0; S.mouth = 0; S.hits = 0; S.misses = 0; S.tilt = 0;
    S.items.length = 0; S.parts.length = 0; S.pops.length = 0;
    player.x = W/2; player.targetX = W/2;
    beep(520, 0.09, "triangle", 0.05);
    beep(780, 0.12, "triangle", 0.04);
  }
  function gameOver(){
    S.mode = "over";
    S.overAt = S.t;
    S.lastQuip = QUIPS[Math.floor(Math.random() * QUIPS.length)];
    if (S.score > S.best){
      S.best = S.score;
      try { localStorage.setItem("dfy_best", String(S.best)); } catch(e){}
    }
    beep(300, 0.16, "sawtooth", 0.05);
    setTimeout(function(){ beep(180, 0.3, "sawtooth", 0.05); }, 120);
  }

  /* ---------- 输入 ---------- */
  function canvasX(clientX){
    var rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * W;
  }
  window.addEventListener("pointermove", function(e){
    if (S.mode !== "play") return;
    player.targetX = clamp(canvasX(e.clientX), player.r, W - player.r);
  }, { passive: true });

  function tap(){
    initAudio();
    if (S.mode === "title" || S.mode === "over") start();
  }
  window.addEventListener("pointerdown", function(e){
    initAudio();
    if (S.mode === "play"){
      player.targetX = clamp(canvasX(e.clientX), player.r, W - player.r);
    } else {
      tap();
    }
  }, { passive: true });

  window.addEventListener("keydown", function(e){
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A"){ keyLeft = true; }
    if (k === "ArrowRight" || k === "d" || k === "D"){ keyRight = true; }
    if (k === " " || k === "Enter"){ e.preventDefault(); tap(); }
    keyDir = (keyRight ? 1 : 0) - (keyLeft ? 1 : 0);
  });
  window.addEventListener("keyup", function(e){
    var k = e.key;
    if (k === "ArrowLeft" || k === "a" || k === "A"){ keyLeft = false; }
    if (k === "ArrowRight" || k === "d" || k === "D"){ keyRight = false; }
    keyDir = (keyRight ? 1 : 0) - (keyLeft ? 1 : 0);
  });
  window.addEventListener("blur", function(){ keyLeft = keyRight = false; keyDir = 0; });

  /* ---------- 更新 ---------- */
  function update(dt){
    S.t += dt;

    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 40);

    if (keyDir !== 0){
      player.targetX += keyDir * 620 * dt;
    }
    player.targetX = clamp(player.targetX, player.r, W - player.r);
    player.x += (player.targetX - player.x) * Math.min(1, dt * 15);
    player.x = clamp(player.x, player.r, W - player.r);
    S.tilt = clamp((player.targetX - player.x) * 0.014, -0.26, 0.26);

    if (S.bubbles.length < 18 && Math.random() < dt * 3){
      S.bubbles.push({ x: rnd(0, W), y: H + 20, r: rnd(2, 7), vy: rnd(18, 46), a: rnd(0.06, 0.2) });
    }
    for (var b = S.bubbles.length - 1; b >= 0; b--){
      var bb = S.bubbles[b];
      bb.y -= bb.vy * dt;
      bb.x += Math.sin(S.t * 1.5 + bb.y * 0.02) * 8 * dt;
      if (bb.y < -20) S.bubbles.splice(b, 1);
    }

    for (var i = S.parts.length - 1; i >= 0; i--){
      var p = S.parts[i];
      p.life -= dt;
      p.vy += 620 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) S.parts.splice(i, 1);
    }
    for (var j = S.pops.length - 1; j >= 0; j--){
      var q = S.pops[j];
      q.life -= dt; q.y -= 46 * dt;
      if (q.life <= 0) S.pops.splice(j, 1);
    }

    if (S.mode !== "play") return;

    if (S.combo > 0){
      S.comboTimer -= dt;
      if (S.comboTimer <= 0){ S.combo = 0; }
    }

    if (S.magnet > 0) S.magnet = Math.max(0, S.magnet - dt);
    if (S.x2 > 0) S.x2 = Math.max(0, S.x2 - dt);
    if (S.slow > 0) S.slow = Math.max(0, S.slow - dt);
    if (S.mouth > 0) S.mouth = Math.max(0, S.mouth - dt);

    S.level = 1 + Math.floor(S.score / 15);

    S.spawnT -= dt;
    if (S.spawnT <= 0){
      spawnItem();
      if (S.level >= 4 && Math.random() < 0.25) spawnItem();
      var base = Math.max(0.34, 0.9 - S.level * 0.045);
      S.spawnT = base * rnd(0.75, 1.35);
    }

    for (var k = S.items.length - 1; k >= 0; k--){
      var it = S.items[k];
      var spd = (S.slow > 0) ? 0.42 : 1;
      it.y += it.vy * dt * spd;
      it.rot += it.spin * dt;

      if (S.magnet > 0 && (it.kind === "rice" || it.kind === "meat" || it.kind === "fish")){
        it.x += (player.x - it.x) * Math.min(1, dt * 4.5);
      }

      var dx = it.x - player.x, dy = it.y - player.y;
      var hitR = player.r * 0.82 + it.r * 0.8;
      if (dx * dx + dy * dy < hitR * hitR){
        S.items.splice(k, 1);
        catchItem(it);
        continue;
      }
      if (it.y > H + 50){
        S.items.splice(k, 1);
        if (it.kind === "rice" || it.kind === "meat" || it.kind === "fish"){
          S.combo = 0;
          S.misses++;
        }
      }
    }
  }

  function catchItem(it){
    var isBad = (it.kind === "chili" || it.kind === "pan");
    if (isBad){
      if (S.shield){
        S.shield = false;
        S.shake = 8;
        burst(it.x, it.y, "#9fe0ff", 16, 240);
        pop(it.x, it.y - 10, "挡住了", "#9fe0ff");
        beep(540, 0.12, "triangle", 0.05);
        return;
      }
      S.lives--;
      S.combo = 0;
      S.shake = 14;
      burst(it.x, it.y, "#ff6b6b", 18, 260);
      pop(it.x, it.y - 10, "辣的！", "#ff8f8f");
      beep(150, 0.18, "square", 0.05);
      if (S.lives <= 0) gameOver();
      return;
    }

    if (it.kind === "shield" || it.kind === "magnet" || it.kind === "x2" || it.kind === "slow" || it.kind === "clear"){
      if (it.kind === "shield"){
        S.shield = true; pop(it.x, it.y - 10, "护盾", "#9fe0ff"); beep(720, 0.1, "triangle", 0.05);
      } else if (it.kind === "magnet"){
        S.magnet = 8; pop(it.x, it.y - 10, "吸铁 8s", "#ff9aa8"); beep(660, 0.1, "triangle", 0.05);
      } else if (it.kind === "x2"){
        S.x2 = 10; pop(it.x, it.y - 10, "双倍 10s", "#ffe08a"); beep(900, 0.1, "triangle", 0.05);
      } else if (it.kind === "slow"){
        S.slow = 5; pop(it.x, it.y - 10, "时缓 5s", "#a8d8ff"); beep(420, 0.14, "sine", 0.05);
      } else {
        var cleared = 0;
        for (var ci = S.items.length - 1; ci >= 0; ci--){
          var bad = S.items[ci];
          if (bad.kind === "chili" || bad.kind === "pan"){
            S.items.splice(ci, 1);
            cleared++;
            burst(bad.x, bad.y, "#bfe9ff", 10, 200);
          }
        }
        S.score += cleared * 2;
        pop(it.x, it.y - 10, cleared ? ("清掉 " + cleared) : "干净了", "#bfe9ff");
        beep(980, 0.12, "triangle", 0.05);
      }
      burst(it.x, it.y, "#cfeaff", 8, 150);
      return;
    }

    S.combo++;
    S.hits++;
    S.mouth = 0.22;
    if (S.combo > S.maxCombo) S.maxCombo = S.combo;
    S.comboTimer = 2.6;
    var base = it.kind === "rice" ? 1 : (it.kind === "meat" ? 3 : 5);
    var gain = base * comboMult() * (S.x2 > 0 ? 2 : 1);
    S.score += gain;

    var color = it.kind === "rice" ? "#bff0ff" : (it.kind === "meat" ? "#ffcf8a" : "#8ee6ff");
    burst(it.x, it.y, color, 10, 180);
    pop(it.x, it.y - 12, "+" + gain, color);

    if (it.kind === "fish"){
      if (S.lives < 3) S.lives++;
      beep(880, 0.14, "triangle", 0.05);
    } else if (it.kind === "meat"){
      beep(600, 0.08, "triangle", 0.045);
    } else {
      beep(440 + Math.min(S.combo, 12) * 28, 0.06, "sine", 0.035);
    }
  }

  /* ---------- 绘制 ---------- */
  function drawBackdrop(){
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#123a63");
    g.addColorStop(0.55, "#0d2745");
    g.addColorStop(1, "#071321");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.fillStyle = "#9fdcff";
    ctx.beginPath();
    ctx.moveTo(W * 0.2, 0); ctx.lineTo(W * 0.36, 0);
    ctx.lineTo(W * 0.62, H); ctx.lineTo(W * 0.44, H);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    for (var i = 0; i < S.bubbles.length; i++){
      var b = S.bubbles[i];
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(160,220,255," + b.a + ")";
      ctx.fill();
    }

    ctx.fillStyle = "rgba(4,10,18,.85)";
    ctx.beginPath();
    ctx.moveTo(0, H - 26);
    ctx.quadraticCurveTo(W * 0.5, H - 46, W, H - 24);
    ctx.lineTo(W, H); ctx.lineTo(0, H);
    ctx.closePath(); ctx.fill();
  }

  function drawFish(x, y, t){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(S.tilt || 0);
    var bob = Math.sin(t * 3) * 2;

    ctx.save();
    ctx.translate(-26, 8 + bob);
    ctx.rotate(Math.sin(t * 4) * 0.18);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-22, -16, -30, -2);
    ctx.quadraticCurveTo(-22, 14, 0, 6);
    ctx.closePath();
    ctx.fillStyle = "#3f8fd6";
    ctx.fill();
    ctx.restore();

    var g = ctx.createLinearGradient(0, -22, 0, 24);
    g.addColorStop(0, "#8fd0f7");
    g.addColorStop(0.55, "#4a9fe0");
    g.addColorStop(1, "#2b66b8");
    ctx.beginPath();
    ctx.ellipse(0, bob, 31, 24, 0, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(1, 9 + bob, 20, 12, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(235,248,255,.82)";
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(-8, 4 + bob, 9, 13, 0.5, 0, Math.PI * 2);
    ctx.fillStyle = "#3f8fd6";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(10, -6 + bob, 8.5, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
    ctx.beginPath();
    ctx.arc(11.5, -5 + bob, 4.6, 0, Math.PI * 2);
    ctx.fillStyle = "#12243d"; ctx.fill();
    ctx.beginPath();
    ctx.arc(9.8, -7 + bob, 1.7, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();

    ctx.beginPath();
    ctx.ellipse(-2, 4 + bob, 6, 3.4, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,143,168,.55)";
    ctx.fill();

    if (S.mouth > 0){
      ctx.beginPath();
      ctx.ellipse(17, 5 + bob, 4.5, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#12243d";
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(16, 2 + bob);
      ctx.quadraticCurveTo(21, 6 + bob, 16, 9 + bob);
      ctx.strokeStyle = "#12243d";
      ctx.lineWidth = 2.2;
      ctx.lineCap = "round";
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawItem(it){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.rot);

    if (it.kind === "rice"){
      ctx.beginPath();
      ctx.moveTo(-19, 2);
      ctx.quadraticCurveTo(-19, 20, 0, 20);
      ctx.quadraticCurveTo(19, 20, 19, 2);
      ctx.closePath();
      ctx.fillStyle = "#8ec9ee"; ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 2, 17, Math.PI, Math.PI * 2);
      ctx.fillStyle = "#ffffff"; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-19, 2); ctx.lineTo(19, 2);
      ctx.strokeStyle = "#4f9bc4"; ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.stroke();
      ctx.fillStyle = "#cfe8f7";
      ctx.beginPath(); ctx.arc(-6, -4, 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -7, 2.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -10, 1.9, 0, Math.PI * 2); ctx.fill();
    }
    else if (it.kind === "meat"){
      ctx.beginPath();
      ctx.ellipse(0, 2, 22, 16, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#8f3d22"; ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-4, -3, 15, 9, -0.3, 0, Math.PI * 2);
      ctx.fillStyle = "#c25c33"; ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-8, -6, 6, 3.2, -0.35, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,220,180,.75)"; ctx.fill();
    }
    else if (it.kind === "fish"){
      ctx.beginPath();
      ctx.ellipse(0, 0, 20, 13, 0, 0, Math.PI * 2);
      ctx.fillStyle = "#7fe3ff"; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-16, 0); ctx.lineTo(-27, -10); ctx.lineTo(-27, 10);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -3, 3.4, 0, Math.PI * 2);
      ctx.fillStyle = "#0b1d33"; ctx.fill();
    }
    else if (it.kind === "chili"){
      ctx.beginPath();
      ctx.moveTo(-14, -10);
      ctx.quadraticCurveTo(10, -18, 16, 4);
      ctx.quadraticCurveTo(8, 18, -6, 10);
      ctx.quadraticCurveTo(-16, 4, -14, -10);
      ctx.closePath();
      ctx.fillStyle = "#e33b3b"; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-13, -11); ctx.lineTo(-19, -18);
      ctx.strokeStyle = "#3f8f4a"; ctx.lineWidth = 3.4; ctx.lineCap = "round"; ctx.stroke();
    }
    else if (it.kind === "shield"){
      ctx.beginPath();
      ctx.moveTo(0, -18);
      ctx.quadraticCurveTo(14, -14, 16, -4);
      ctx.quadraticCurveTo(16, 10, 0, 18);
      ctx.quadraticCurveTo(-16, 10, -16, -4);
      ctx.quadraticCurveTo(-14, -14, 0, -18);
      ctx.closePath();
      ctx.fillStyle = "#2f7fc4"; ctx.fill();
      ctx.strokeStyle = "#bfe9ff"; ctx.lineWidth = 2.6; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-7, 0); ctx.lineTo(-1, 7); ctx.lineTo(8, -6);
      ctx.strokeStyle = "#eaf7ff"; ctx.lineWidth = 3.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke();
    }
    else if (it.kind === "magnet"){
      ctx.beginPath(); ctx.arc(0, 2, 13, Math.PI, 0);
      ctx.strokeStyle = "#ff6b81"; ctx.lineWidth = 9; ctx.stroke();
      ctx.fillStyle = "#ff6b81";
      ctx.fillRect(-18, 2, 9, 11); ctx.fillRect(9, 2, 9, 11);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-18, 9, 9, 4); ctx.fillRect(9, 9, 9, 4);
    }
    else if (it.kind === "x2"){
      ctx.beginPath();
      for (var s = 0; s < 10; s++){
        var ang = -Math.PI / 2 + s * Math.PI / 5;
        var rr = (s % 2 === 0) ? 17 : 7;
        ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = "#ffd166"; ctx.fill();
      ctx.fillStyle = "#6b4a00";
      ctx.font = "bold 13px system-ui,sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("x2", 0, 1);
    }
    else if (it.kind === "slow"){
      ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2);
      ctx.fillStyle = "#1f4f7a"; ctx.fill();
      ctx.strokeStyle = "#a8d8ff"; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(0, -10);
      ctx.moveTo(0, 0); ctx.lineTo(7, 4);
      ctx.strokeStyle = "#dff2ff"; ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.stroke();
    }
    else if (it.kind === "clear"){
      ctx.beginPath();
      ctx.ellipse(0, 5, 14, 9, -0.35, 0, Math.PI * 2);
      ctx.fillStyle = "#9fe6d8"; ctx.fill();
      ctx.strokeStyle = "#dffff7"; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(9, -2); ctx.lineTo(18, -16);
      ctx.strokeStyle = "#c9fff2"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 5, 5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
    }
    else {
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fillStyle = "#5b6674"; ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.fillStyle = "#39424e"; ctx.fill();
      ctx.beginPath();
      ctx.rect(12, -4, 22, 7);
      ctx.fillStyle = "#7b8798"; ctx.fill();
    }

    ctx.restore();
  }

  function drawHUD(){
    ctx.save();
    ctx.font = "700 30px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillStyle = "#e8f6ff";
    ctx.textAlign = "left";
    ctx.fillText(String(S.score), 22, 48);

    ctx.font = "500 14px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillStyle = "rgba(200,230,255,.55)";
    ctx.fillText("最高 " + S.best, 22, 70);

    for (var i = 0; i < 3; i++){
      var hx = W - 30 - i * 28, hy = 38;
      ctx.globalAlpha = i < S.lives ? 1 : 0.2;
      ctx.beginPath();
      ctx.moveTo(hx, hy + 6);
      ctx.bezierCurveTo(hx - 12, hy - 8, hx - 14, hy + 2, hx, hy + 12);
      ctx.bezierCurveTo(hx + 14, hy + 2, hx + 12, hy - 8, hx, hy + 6);
      ctx.closePath();
      ctx.fillStyle = "#ff7f9c";
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (S.mode === "play"){
      var cx = 22, cy = H - 32;
      ctx.font = "600 12px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign = "left";
      if (S.shield){
        ctx.fillStyle = "rgba(159,224,255,.16)"; ctx.fillRect(cx, cy, 48, 20);
        ctx.fillStyle = "#9fe0ff"; ctx.fillText("护盾", cx + 9, cy + 14); cx += 56;
      }
      if (S.magnet > 0){
        ctx.fillStyle = "rgba(255,107,129,.16)"; ctx.fillRect(cx, cy, 68, 20);
        ctx.fillStyle = "#ff9aa8"; ctx.fillText("吸铁 " + Math.ceil(S.magnet) + "s", cx + 9, cy + 14); cx += 76;
      }
      if (S.x2 > 0){
        ctx.fillStyle = "rgba(255,209,102,.16)"; ctx.fillRect(cx, cy, 68, 20);
        ctx.fillStyle = "#ffd166"; ctx.fillText("双倍 " + Math.ceil(S.x2) + "s", cx + 9, cy + 14); cx += 76;
      }
      if (S.slow > 0){
        ctx.fillStyle = "rgba(168,216,255,.16)"; ctx.fillRect(cx, cy, 68, 20);
        ctx.fillStyle = "#a8d8ff"; ctx.fillText("时缓 " + Math.ceil(S.slow) + "s", cx + 9, cy + 14); cx += 76;
      }
    }

    if (S.combo >= 3 && S.mode === "play"){
      ctx.textAlign = "center";
      ctx.font = "700 20px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.fillStyle = "#8ee6ff";
      ctx.fillText("连击 " + S.combo + "  ×" + comboMult(), W / 2, 44);
      ctx.fillStyle = "rgba(142,230,255,.9)";
      ctx.fillRect(W / 2 - 50, 52, 100 * clamp(S.comboTimer / 2.6, 0, 1), 3);
    }
    ctx.restore();
  }

  function drawTitle(){
    ctx.save();
    ctx.fillStyle = "rgba(5,13,23,.62)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#e9f7ff";
    ctx.font = "800 40px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("大肥鱼", W / 2, H / 2 - 92);
    ctx.font = "800 30px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillStyle = "#8ee6ff";
    ctx.fillText("干饭大作战", W / 2, H / 2 - 48);

    ctx.font = "400 16px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillStyle = "rgba(215,238,255,.82)";
    ctx.fillText("白饭 +1　红烧肉 +3　小鲸鱼 +5 且补命", W / 2, H / 2 + 16);
    ctx.fillText("辣椒 和 锅铲，别接；护盾、吸铁、双倍、时缓、清屏，记得接", W / 2, H / 2 + 42);

    ctx.font = "400 14px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillStyle = "rgba(180,215,245,.6)";
    ctx.fillText("鼠标 / 方向键 / AD 控制，手指滑也行", W / 2, H / 2 + 84);

    var pulse = 0.6 + 0.4 * Math.sin(S.t * 3);
    ctx.globalAlpha = pulse;
    ctx.font = "700 18px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillStyle = "#bff0ff";
    ctx.fillText("点一下 / 空格 开始", W / 2, H / 2 + 150);
    ctx.restore();
  }

  function drawOver(){
    ctx.save();
    ctx.fillStyle = "rgba(5,13,23,.72)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd6de";
    ctx.font = "800 30px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText("碗空了", W / 2, H / 2 - 96);

    ctx.fillStyle = "#eaf7ff";
    ctx.font = "800 56px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText(String(S.score), W / 2, H / 2 - 22);

    ctx.font = "400 16px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillStyle = "rgba(200,230,255,.7)";
    var totalTry = S.hits + S.misses;
    var rate = totalTry > 0 ? Math.round(S.hits / totalTry * 100) : 0;
    ctx.fillText("最高 " + S.best + " · 连击 " + S.maxCombo, W / 2, H / 2 + 4);
    ctx.fillText("命中率 " + rate + "%　（接 " + S.hits + " / 漏 " + S.misses + "）", W / 2, H / 2 + 28);
    ctx.fillText(S.lastQuip, W / 2, H / 2 + 48);

    ctx.font = "700 18px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillStyle = "#bff0ff";
    ctx.fillText("点一下 / 空格 再来一局", W / 2, H / 2 + 120);
    ctx.restore();
  }

  /* ---------- 主循环 ---------- */
  var last = 0;
  function frame(ts){
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000);
    last = ts;

    update(dt);

    ctx.save();
    if (S.shake > 0){
      ctx.translate(rnd(-S.shake, S.shake), rnd(-S.shake, S.shake));
    }
    drawBackdrop();

    for (var i = 0; i < S.items.length; i++) drawItem(S.items[i]);

    for (var p = 0; p < S.parts.length; p++){
      var pt = S.parts[p];
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawFish(player.x, player.y, S.t);

    for (var q = 0; q < S.pops.length; q++){
      var po = S.pops[q];
      ctx.globalAlpha = Math.max(0, po.life / po.max);
      ctx.fillStyle = po.color;
      ctx.font = "700 20px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(po.text, po.x, po.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawHUD();

    if (S.mode === "title") drawTitle();
    if (S.mode === "over") drawOver();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
